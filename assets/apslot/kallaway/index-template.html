<!doctype html>
<!-- APSlot house template · Kallaway Breakdown (engine style "breakdown").
     Top two thirds: motion-graphic canvas on a dark grid, white header with the key words on a red bar,
     James in a rounded band below; full-face punch-ins; white Barlow captions, upper case, 1 to 2 words,
     no colour highlight. Filled by assets/apslot/build.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: "Barlow"; src: url("fonts/barlow-700-latin.woff2") format("woff2"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Barlow"; src: url("fonts/barlow-800-latin.woff2") format("woff2"); font-weight: 800; font-display: block; }
      @font-face { font-family: "Barlow"; src: url("fonts/barlow-900-latin.woff2") format("woff2"); font-weight: 900; font-display: block; }
      @font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-700-latin.woff2") format("woff2"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-800-latin.woff2") format("woff2"); font-weight: 800; font-display: block; }
      @font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-900-latin.woff2") format("woff2"); font-weight: 900; font-display: block; }

      :root {
        --bg: #0d0d0e; --grid: #1b1b1e; --card: #18181b; --line: #34343a;
        --red: #ff3b30; --green: #22c55e; --blue: #3b82f6; --gold: #ffe600; --white: #f6f6f6; --muted: #96969e;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0d0e; color: #fff;
        font-family: "Barlow", "Barlow Condensed", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      #stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #backdrop { position: absolute; inset: 0; background: radial-gradient(900px 700px at 50% 8%, rgba(34,197,94,0.10), transparent 62%), var(--bg); }
      #backdrop::after { content: ""; position: absolute; inset: 0; background-image:
          linear-gradient(rgba(150,150,158,0.09) 1px, transparent 1px), linear-gradient(90deg, rgba(150,150,158,0.09) 1px, transparent 1px);
          background-size: 90px 90px; }

      /* James in a rounded band below the canvas (CSS base top:1080px; moved with y transforms only) */
      .video-wrapper { position: absolute; left: 0; top: 1080px; width: 1080px; height: 840px; overflow: hidden; background: #000;
        border-radius: 44px 44px 0 0; }
      .video-wrapper video { width: 100%; height: 100%; object-fit: cover; }
      #band-edge { position: absolute; left: 0; top: 1080px; width: 1080px; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #15803d, var(--green)); z-index: 3; }
      .video-full { position: absolute; inset: 0; overflow: hidden; visibility: hidden; opacity: 0; background: #000; }
      .video-full video { width: 100%; height: 100%; object-fit: cover; }
      #vignette-full { position: absolute; inset: 0; opacity: 0; pointer-events: none;
        background: linear-gradient(180deg, rgba(0,0,0,0.40) 0%, transparent 20%, transparent 58%, rgba(0,0,0,0.80) 100%); }
      #progress { position: absolute; left: 0; top: 0; width: 1080px; height: 8px; z-index: 80; background: linear-gradient(90deg, #15803d, var(--green)); transform-origin: left center; transform: scaleX(0); }
      #wordmark { position: absolute; left: 48px; top: 36px; z-index: 70; font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 800; font-size: 38px; letter-spacing: 0.04em; }
      #wordmark b { color: var(--green); font-weight: 900; }
      #legal { position: absolute; right: 48px; top: 42px; z-index: 70; font-weight: 700; font-size: 28px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }

      .card-host { position: absolute; pointer-events: none; overflow: hidden; }
      .card-host .card { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .root { position: relative; width: 100%; height: 100%; }
      .sq { position: relative; padding: 110px 60px 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; width: 100%; height: 100%; }

      /* white header, key words on the red bar */
      .hdr { font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 900; font-size: 84px; line-height: 1.02; text-transform: uppercase; text-align: center; letter-spacing: 0.01em; max-width: 960px; }
      .hdr .bar { display: inline-block; background: var(--red); color: #fff; padding: 2px 24px 6px; border-radius: 12px; }
      .chip { display: inline-flex; align-items: center; gap: 18px; font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 800; font-size: 54px; letter-spacing: 0.03em; color: #fff;
        background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 20px 42px; text-transform: uppercase; white-space: normal; text-align: center; line-height: 1.05; max-width: 960px; }
      .chip.long { font-size: 44px; padding: 18px 34px; }
      .big { font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 900; font-size: 230px; line-height: 0.95; letter-spacing: -0.01em; }
      .track { position: relative; width: 900px; height: 40px; border-radius: 20px; background: var(--card); border: 3px solid var(--line); overflow: hidden; }
      .track .fill { position: absolute; left: 0; top: 0; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, #15803d, var(--green)); border-radius: 20px; }
      .chip .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--blue); flex: none; }
      .chip.red { border-color: var(--red); } .chip.red .dot { background: var(--red); }
      .chip.green { border-color: var(--green); } .chip.green .dot { background: var(--green); }
      .chip.gold { border-color: var(--gold); color: var(--gold); } .chip.gold .dot { background: var(--gold); }
      .rows { display: flex; flex-direction: column; align-items: center; gap: 22px; }
      .stamp { position: absolute; left: 50%; top: 470px; width: 600px; margin-left: -300px; text-align: center; font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 900; font-size: 120px; letter-spacing: 0.06em; color: var(--red); border: 10px solid var(--red);
        border-radius: 22px; padding: 6px 40px; transform: rotate(-8deg); text-transform: uppercase; background: rgba(13,13,14,0.88); }
      .vs { display: flex; align-items: stretch; gap: 26px; width: 960px; }
      .panel { position: relative; flex: 1; min-height: 300px; border-radius: 24px; background: var(--card); border: 3px solid var(--line); padding: 36px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
      .panel .lab { font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
      .panel .txt { font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 900; font-size: 64px; line-height: 1; text-transform: uppercase; }
      .panel.green { border-color: var(--green); box-shadow: 0 0 60px rgba(34,197,94,0.35); }
      .shot { position: relative; width: 900px; height: 620px; border-radius: 26px; overflow: hidden; background: #000; border: 3px solid var(--line); box-shadow: 0 30px 90px rgba(0,0,0,0.6); }
      .shot .media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .tag { position: absolute; left: 22px; top: 18px; font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; background: rgba(13,13,14,0.75); border-radius: 10px; padding: 6px 14px; }
      .fchip { position: absolute; left: 50%; top: 1190px; transform: translateX(-50%); font-size: 62px; padding: 24px 50px; }
      .cta { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; padding: 0 80px; text-align: center; }
      .cta .wm { font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 900; font-size: 190px; line-height: 0.9; letter-spacing: 0.02em; }
      .cta .wm b { color: var(--green); }
      .cta .line1 { font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 800; font-size: 92px; line-height: 1; text-transform: uppercase; max-width: 940px; }
      .cta .line2 { font-family: "Barlow Condensed", Arial, sans-serif; font-weight: 800; font-size: 50px; color: #04140a; background: var(--green); border-radius: 999px; padding: 26px 58px; letter-spacing: 0.02em; }
      .cta .fine { margin-top: 30px; font-weight: 700; font-size: 28px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }

      /* initial-hide (generated): CSS, never tl.set at 0 */
      {{HIDE_LIST}}

      /* captions: white Barlow ExtraBold, upper case, 1 to 2 words, big shadow, no colour */
      #captions { position: absolute; inset: 0; pointer-events: none; }
      .cap { position: absolute; left: 40px; width: 1000px; text-align: center; font-family: "Barlow", Arial, sans-serif; font-weight: 800; font-size: 92px; line-height: 1.1; color: #fff;
        visibility: hidden; opacity: 0; text-transform: uppercase; letter-spacing: 0.01em; text-shadow: 0 4px 10px rgba(0,0,0,0.9), 0 12px 40px rgba(0,0,0,0.7); }
      .cap em { font-style: normal; font-weight: 900; color: #fff; }
      {{CAP_TOP_CSS}}
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="{{COMPOSITION_ID}}" data-start="0" data-duration="{{DUR}}" data-fps="30" data-width="1080" data-height="1920">
      <div id="backdrop"></div>
      <div class="video-wrapper" id="video-wrap">
        <video id="bg-video" src="input-video.mp4" muted playsinline data-start="0" data-duration="{{VIDEO_DUR}}" data-track-index="1"></video>
      </div>
      <audio id="source-audio" src="input-video.mp4" data-start="0" data-duration="{{VIDEO_DUR}}" data-track-index="10" data-volume="1"></audio>
      <div class="video-full" id="video-full">
        <video id="full-video" src="input-video-vert.mp4" muted playsinline data-start="0" data-duration="{{VIDEO_DUR}}" data-track-index="4"></video>
      </div>
      <div id="band-edge"></div>
      <div id="vignette-full"></div>
      <div id="progress"></div>
      <div id="wordmark"><b>AP</b>SLOT.COM</div>
      <div id="legal">Education only · 21+</div>

{{SFX_ELEMENTS}}

{{CARDS}}

      <div id="captions" data-track-index="5">
{{CAPTION_SPANS}}
      </div>

      <script src="vendor/gsap.min.js"></script>
      <script>
        (function () {
          var tl = window.gsap.timeline({ paused: true });
          var Q = function (t) { return Math.round(t * 30) / 30; };
          var DUR = {{DUR}};
          function enter(sel, at, dur) { tl.set(sel, { visibility: "visible" }, Q(at)); tl.fromTo(sel, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: dur || 0.3, ease: "power2.out" }, Q(at)); }
          function exit(sel, at, dur) { tl.to(sel, { opacity: 0, duration: dur || 0.22, ease: "power2.in" }, Q(at)); tl.set(sel, { visibility: "hidden" }, Q(at + (dur || 0.22))); }
          function pop(sel, at, dur, from) { tl.fromTo(sel, { opacity: 0, scale: from || 0.7 }, { opacity: 1, scale: 1, duration: dur || 0.4, ease: "back.out(1.7)", immediateRender: false }, Q(at)); }
          function rise(sel, at, dur) { tl.fromTo(sel, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: dur || 0.45, ease: "power2.out", immediateRender: false }, Q(at)); }
          function slam(sel, at) { tl.fromTo(sel, { opacity: 0, scale: 1.6, rotation: -8 }, { opacity: 1, scale: 1, rotation: -8, duration: 0.26, ease: "power3.out", immediateRender: false }, Q(at)); }
          function countUp(sel, from, to, at, dur, fmt) { var o = { v: from }; tl.to(o, { v: to, duration: dur, ease: "power2.out", onUpdate: function () { var el = document.querySelector(sel); if (!el) return; el.textContent = (fmt === "$" ? "$" : "") + Math.round(o.v).toLocaleString("en-US"); } }, Q(at)); }
          function punch(w) { tl.to("#bg-video", { scale: 1.07, duration: 0.15, ease: "power2.out" }, Q(w)); tl.to("#bg-video", { scale: 1.0, duration: 0.35, ease: "power2.inOut" }, Q(w + 0.18)); }
          function toFullhim(t, hold) {
            tl.set("#video-full", { visibility: "visible" }, Q(t - 0.04));
            tl.fromTo("#video-full", { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, Q(t - 0.04));
            tl.to("#video-wrap", { opacity: 0, duration: 0.12 }, Q(t));
            tl.to("#band-edge", { opacity: 0, duration: 0.12 }, Q(t));
            tl.fromTo("#vignette-full", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, Q(t + 0.03));
            tl.fromTo("#full-video", { scale: 1 }, { scale: 1.05, duration: Math.max(0.3, hold), ease: "none", immediateRender: false }, Q(t));
          }
          function toSplit(t) {
            tl.to("#video-wrap", { opacity: 1, duration: 0.12 }, Q(t - 0.04));
            tl.to("#band-edge", { opacity: 1, duration: 0.12 }, Q(t - 0.04));
            tl.to("#video-full", { opacity: 0, duration: 0.12 }, Q(t));
            tl.set("#video-full", { visibility: "hidden" }, Q(t + 0.14));
            tl.to("#vignette-full", { opacity: 0, duration: 0.2 }, Q(t));
          }
          function toTakeover(t) {
            tl.to("#video-wrap", { y: 900, opacity: 0, duration: 0.4, ease: "power2.in" }, Q(t));
            tl.to("#band-edge", { opacity: 0, duration: 0.2 }, Q(t));
            tl.to("#video-full", { opacity: 0, duration: 0.3 }, Q(t));
          }
          tl.fromTo("#progress", { scaleX: 0 }, { scaleX: 1, duration: DUR - 0.13, ease: "none" }, 0.05);

{{TIMELINE}}

          /* captions (generated) */
{{CAPTION_TWEENS}}

          window.__timelines = window.__timelines || {};
          window.__timelines["{{COMPOSITION_ID}}"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
